services:
  repl:
    image: ${DOCKER_IMAGE_NAME_APP}:${DOCKER_IMAGE_TAG_APP}

    command:
      - node_modules/.bin/moleculer-runner
      - --repl
      - --config
      - ./src/config/moleculer.config.js
      - -E
      - ${DOCKER_ENV_FILE_APP}

    env_file:
      - ${DOCKER_ENV_FILE_APP}

    networks:
      - backend

    depends_on:
      - nats

    profiles:
      - tools