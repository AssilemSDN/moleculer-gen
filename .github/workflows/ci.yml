name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack for cache detection
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Check Yarn version
        run: yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Audit production dependencies
        run: yarn audit:prod

      - name: Check npm package content
        run: yarn pack --dry-run
      - name: Smoke test packaged CLI
        run: |
          PACKAGE_PATH="/tmp/moleculer-gen.tgz"
          TEST_DIR="$(mktemp -d)"

          yarn pack --out "$PACKAGE_PATH"

          cd "$TEST_DIR"
          npm init --yes >/dev/null
          npm install "$PACKAGE_PATH"

          ./node_modules/.bin/moleculer-gen --help

  tests:
    name: Tests — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Unit coverage
        run: yarn test:unit:coverage

      - name: Upload unit coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/unit/lcov.info
          flags: unit
          name: unit
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Integration coverage
        run: yarn test:integration:coverage

      - name: Upload integration coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/integration/lcov.info
          flags: integration
          name: integration
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
