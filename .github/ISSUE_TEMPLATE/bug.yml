name: Bug report
description: Report a reproducible problem with moleculer-gen
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!

        Please provide enough information to reproduce the issue.

        Security vulnerabilities should be reported privately through GitHub Security Advisories.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example you can.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: moleculer-gen version
      placeholder: "0.x.x"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v24.x.x"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - WSL
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or command output
      description: |
        Add any relevant logs or output.

        Remove secrets, tokens, credentials, private URLs, and other sensitive information.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add configuration, screenshots, examples, or anything else that may help.
